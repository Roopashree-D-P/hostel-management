<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Rooms</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-danger px-3">
    <span class="navbar-brand">Manage Rooms</span>
    <a th:href="@{/admin/dashboard}" class="btn btn-light btn-sm">Back</a>
</nav>
<div class="container mt-4">
    <div th:if="${param.success}" class="alert alert-success">Room added!</div>
    <h5>Add New Room</h5>
    <form method="post" th:action="@{/admin/rooms/add}" class="row g-2 mb-4">
        <div class="col-md-3"><input name="roomNumber" class="form-control" placeholder="Room Number" required></div>
        <div class="col-md-2">
            <select name="type" class="form-select">
                <option value="SINGLE">Single</option>
                <option value="DOUBLE">Double</option>
                <option value="TRIPLE">Triple</option>
            </select>
        </div>
        <div class="col-md-2"><input name="capacity" type="number" class="form-control" placeholder="Capacity" required></div>
        <div class="col-md-2"><input name="feePerMonth" type="number" class="form-control" placeholder="Fee/Month" required></div>
        <div class="col-md-2"><button class="btn btn-danger w-100">Add Room</button></div>
    </form>
    <table class="table table-bordered">
        <thead class="table-dark">
        <tr><th>Room No</th><th>Type</th><th>Capacity</th><th>Occupied</th><th>Fee</th><th>Available</th><th>Action</th></tr>
        </thead>
        <tbody>
        <tr th:each="r : ${rooms}">
            <td th:text="${r.roomNumber}"></td>
            <td th:text="${r.type}"></td>
            <td th:text="${r.capacity}"></td>
            <td th:text="${r.currentOccupancy}"></td>
            <td th:text="'₹' + ${r.feePerMonth}"></td>
            <td th:text="${r.available} ? 'Yes' : 'No'"></td>
            <td>
                <form method="post" th:action="@{/admin/rooms/delete/{id}(id=${r.id})}">
                    <button class="btn btn-sm btn-danger">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
