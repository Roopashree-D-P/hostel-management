<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>All Payments</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-danger px-3">
  <span class="navbar-brand">All Payments</span>
  <a th:href="@{/admin/dashboard}" class="btn btn-light btn-sm">Back</a>
</nav>
<div class="container mt-4">
  <table class="table table-bordered table-hover">
    <thead class="table-dark">
    <tr><th>Student</th><th>Month</th><th>Amount</th><th>Date</th><th>Status</th></tr>
    </thead>
    <tbody>
    <tr th:each="p : ${payments}">
      <td th:text="${p.student.fullName}"></td>
      <td th:text="${p.month}"></td>
      <td th:text="'₹' + ${p.amount}"></td>
      <td th:text="${p.paymentDate} ?: '-'"></td>
      <td>
                <span th:text="${p.status}"
                      th:classappend="${p.status.name() == 'PAID'} ? 'badge bg-success' : 'badge bg-danger'"></span>
      </td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>
