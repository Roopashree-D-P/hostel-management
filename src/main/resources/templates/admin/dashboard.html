<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Admin Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-danger px-3">
  <span class="navbar-brand">Hostel MS – Admin</span>
  <div>
    <a th:href="@{/admin/users}" class="btn btn-light btn-sm me-2">Users</a>
    <a th:href="@{/admin/rooms}" class="btn btn-light btn-sm me-2">Rooms</a>
    <a th:href="@{/admin/payments}" class="btn btn-light btn-sm me-2">Payments</a>
    <a th:href="@{/auth/logout}" class="btn btn-dark btn-sm">Logout</a>
  </div>
</nav>
<div class="container mt-4">
  <h4>Admin Dashboard</h4>
  <div class="row mt-3">
    <div class="col-md-4">
      <div class="card text-white bg-primary">
        <div class="card-body">
          <h5>Total Users</h5>
          <h2 th:text="${totalUsers}"></h2>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card text-white bg-success">
        <div class="card-body">
          <h5>Total Rooms</h5>
          <h2 th:text="${totalRooms}"></h2>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card text-white bg-warning">
        <div class="card-body">
          <h5>Total Payments</h5>
          <h2 th:text="${totalPayments}"></h2>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
