<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Allocations</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-3">
  <span class="navbar-brand">Room Allocations</span>
  <a th:href="@{/warden/dashboard}" class="btn btn-light btn-sm">Back</a>
</nav>
<div class="container mt-4">
  <h5>Pending Requests</h5>
  <table class="table table-bordered">
    <thead class="table-warning">
    <tr><th>Student</th><th>Room</th><th>Request Date</th><th>Actions</th></tr>
    </thead>
    <tbody>
    <tr th:each="a : ${pending}">
      <td th:text="${a.student.fullName}"></td>
      <td th:text="${a.room.roomNumber}"></td>
      <td th:text="${a.requestDate}"></td>
      <td>
        <form method="post" th:action="@{/warden/allocations/approve/{id}(id=${a.id})}" style="display:inline">
          <button class="btn btn-sm btn-success">Approve</button>
        </form>
        <form method="post" th:action="@{/warden/allocations/approve/{id}(id=${a.id})}" style="display:inline">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button class="btn btn-sm btn-success">Approve</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>
  <h5 class="mt-4">All Allocations</h5>
  <table class="table table-bordered">
    <thead class="table-dark">
    <tr><th>Student</th><th>Room</th><th>Status</th><th>Date</th></tr>
    </thead>
    <tbody>
    <tr th:each="a : ${all}">
      <td th:text="${a.student.fullName}"></td>
      <td th:text="${a.room.roomNumber}"></td>
      <td th:text="${a.status}"></td>
      <td th:text="${a.allocationDate} ?: '-'"></td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>
