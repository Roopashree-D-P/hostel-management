<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Warden Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-3">
  <span class="navbar-brand">Hostel MS – Warden</span>
  <div>
    <a th:href="@{/warden/allocations}" class="btn btn-light btn-sm me-2">Allocations</a>
    <a th:href="@{/warden/complaints}" class="btn btn-light btn-sm me-2">Complaints</a>
    <a th:href="@{/auth/logout}" class="btn btn-danger btn-sm">Logout</a>
  </div>
</nav>
<div class="container mt-4">
  <h4>Warden Dashboard</h4>
  <div class="row mt-3">
    <div class="col-md-6">
      <div class="card bg-warning text-dark">
        <div class="card-body">
          <h5>Pending Allocations</h5>
          <p th:text="${pendingAllocations.size()} + ' pending'"></p>
          <a th:href="@{/warden/allocations}" class="btn btn-dark btn-sm">Manage</a>
        </div>
      </div>
    </div>
    <div class="col-md-6">
      <div class="card bg-info text-white">
        <div class="card-body">
          <h5>All Complaints</h5>
          <p th:text="${allComplaints.size()} + ' total'"></p>
          <a th:href="@{/warden/complaints}" class="btn btn-light btn-sm">Manage</a>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
