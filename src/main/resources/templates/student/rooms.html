<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Available Rooms</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-primary px-3">
  <span class="navbar-brand">Available Rooms</span>
  <a th:href="@{/student/dashboard}" class="btn btn-light btn-sm">Back</a>
</nav>
<div class="container mt-4">
  <div th:if="${param.success}" class="alert alert-success">Room requested successfully!</div>
  <div th:if="${param.error}" class="alert alert-danger">Could not request room.</div>
  <table class="table table-bordered table-hover">
    <thead class="table-dark">
    <tr>
      <th>Room No</th><th>Type</th><th>Capacity</th><th>Occupancy</th><th>Fee/Month</th><th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="room : ${rooms}">
      <td th:text="${room.roomNumber}"></td>
      <td th:text="${room.type}"></td>
      <td th:text="${room.capacity}"></td>
      <td th:text="${room.currentOccupancy}"></td>
      <td th:text="'₹' + ${room.feePerMonth}"></td>
      <td>
        <form method="post" th:action="@{/student/rooms/request/{id}(id=${room.id})}">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit" class="btn btn-sm btn-primary">Request</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>
