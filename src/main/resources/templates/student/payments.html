<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Payments</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-success px-3">
  <span class="navbar-brand">My Payments</span>
  <a th:href="@{/student/dashboard}" class="btn btn-light btn-sm">Back</a>
</nav>
<div class="container mt-4">
  <div th:if="${param.success}" class="alert alert-success">Payment successful!</div>
  <table class="table table-bordered">
    <thead class="table-dark">
    <tr><th>Month</th><th>Amount</th><th>Date</th><th>Status</th><th>Action</th></tr>
    </thead>
    <tbody>
    <tr th:each="p : ${payments}">
      <td th:text="${p.month}"></td>
      <td th:text="'₹' + ${p.amount}"></td>
      <td th:text="${p.paymentDate} ?: 'Not paid yet'"></td>
      <td>
                <span th:text="${p.status}"
                      th:classappend="${p.status.name() == 'PAID'} ? 'badge bg-success' : 'badge bg-danger'"></span>
      </td>
      <td>
        <form th:if="${p.status.name() == 'PENDING'}"
              method="post" th:action="@{/student/payments/pay/{id}(id=${p.id})}">
          <button class="btn btn-sm btn-success">Pay Now</button>
        </form>
        <span th:if="${p.status.name() == 'PAID'}" class="text-muted">Paid</span>
      </td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>
