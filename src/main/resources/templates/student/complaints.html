<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Complaints</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-warning px-3">
    <span class="navbar-brand">My Complaints</span>
    <a th:href="@{/student/dashboard}" class="btn btn-light btn-sm">Back</a>
</nav>
<div class="container mt-4">
    <div th:if="${param.success}" class="alert alert-success">Complaint raised!</div>
    <h5>Raise a Complaint</h5>
    <form method="post" th:action="@{/student/complaints/raise}" class="mb-4">
        <div class="mb-2">
            <input type="text" name="title" class="form-control" placeholder="Title" required>
        </div>
        <div class="mb-2">
            <textarea name="description" class="form-control" rows="3" placeholder="Describe the issue..." required></textarea>
        </div>
        <button type="submit" class="btn btn-warning">Submit Complaint</button>
    </form>
    <h5>My Complaints</h5>
    <table class="table table-bordered">
        <thead class="table-dark">
        <tr><th>Title</th><th>Date</th><th>Status</th></tr>
        </thead>
        <tbody>
        <tr th:each="c : ${complaints}">
            <td th:text="${c.title}"></td>
            <td th:text="${c.raisedDate}"></td>
            <td>
                <span th:text="${c.status}"
                      th:classappend="${c.status.name() == 'RESOLVED'} ? 'badge bg-success' :
                                      (${c.status.name() == 'IN_PROGRESS'} ? 'badge bg-warning text-dark' :
                                      'badge bg-secondary')"></span>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
