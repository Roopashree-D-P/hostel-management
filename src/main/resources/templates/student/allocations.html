<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Allocations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-primary px-3">
    <span class="navbar-brand">My Allocations</span>
    <a th:href="@{/student/dashboard}" class="btn btn-light btn-sm">Back</a>
</nav>

<div class="container mt-4">
    <table class="table table-bordered">
        <thead class="table-dark">
        <tr>
            <th>Room</th>
            <th>Status</th>
            <th>Request Date</th>
            <th>Allocation Date</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="a : ${allocations}">
            <td th:text="${a.room.roomNumber}"></td>
            <td th:text="${a.status}"></td>
            <td th:text="${a.requestDate}"></td>
            <td th:text="${a.allocationDate} ?: '-'"></td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
